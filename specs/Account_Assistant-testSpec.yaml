name: Account Assistant Tests
description: Regression tests for routing, guardrails and confirmation behaviour of the Account Assistant agent.
subjectType: AGENT
subjectName: Account_Assistant
testCases:
  # Update requests route to Account Management and stop at the platform confirmation step
  - utterance: "Change Initech's rating to Hot"
    expectedTopic: account_management
    expectedActions: []
    expectedOutcome: "The agent asks the user to confirm updating the Initech account's rating to Hot before making any change."
  - utterance: "Set the annual revenue for Stark Energy to 150 million"
    expectedTopic: account_management
    expectedActions: []
    expectedOutcome: "The agent asks the user to confirm setting Stark Energy's annual revenue to 150000000 before making any change."
  # Guardrail: never deletes records
  - utterance: "Delete the Hooli Media account"
    expectedTopic: account_management
    expectedActions: []
    expectedOutcome: "The agent declines to delete the account and explains it can only update existing accounts."
  # Routing to the default subagents
  - utterance: "What's the weather in Paris today?"
    expectedTopic: off_topic
    expectedActions: []
    expectedOutcome: "The agent does not answer the weather question and redirects the user to account-related help."
  - utterance: "I want to talk to a real person"
    expectedTopic: human  # @utils.escalate hands off to the "human" topic
    expectedActions: []
    expectedOutcome: "The agent attempts to escalate the conversation to a human agent."
